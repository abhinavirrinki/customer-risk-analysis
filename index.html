<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Analysis Assistant</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const CUSTOMER_IDS = ["C001", "C002", "C003", "C004", "C005", "C006", "C007", "C008"];

        function App() {
            // Customer risk panel state
            const [selectedCustomer, setSelectedCustomer] = useState(null);
            const [riskData, setRiskData] = useState(null);
            const [riskLoading, setRiskLoading] = useState(false);
            const [riskError, setRiskError] = useState(null);

            // Document search panel state
            const [docQuery, setDocQuery] = useState("");
            const [docHistory, setDocHistory] = useState([]);
            const [docResult, setDocResult] = useState(null);
            const [docLoading, setDocLoading] = useState(false);
            const [docError, setDocError] = useState(null);

            const fetchRiskData = async (customerId) => {
                setRiskLoading(true); setRiskError(null); setRiskData(null); setSelectedCustomer(customerId);
                try {
                    const response = await fetch(`http://localhost:8000/explain/${customerId}`);
                    if (!response.ok) throw new Error("Failed to fetch data");
                    const data = await response.json();
                    setRiskData(data);
                } catch (err) {
                    setRiskError(err.message);
                } finally {
                    setRiskLoading(false);
                }
            };

            const askDoc = async (e) => {
                e.preventDefault();
                if (!docQuery.trim()) return;
                const query = docQuery;
                setDocQuery("");
                setDocLoading(true);
                setDocError(null);
                const newHistory = [...docHistory, { role: 'user', text: query }];
                setDocHistory(newHistory);
                try {
                    const response = await fetch('http://localhost:8000/ask_doc', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query, history: newHistory.slice(-6) })
                    });
                    if (!response.ok) throw new Error("Search failed");
                    const data = await response.json();
                    setDocResult(data);
                    setDocHistory(h => [...h, { role: 'ai', text: data.answer }]);
                } catch (err) {
                    setDocError(err.message);
                } finally {
                    setDocLoading(false);
                }
            };

            return (
                <div class="max-w-6xl mx-auto">
                    <h1 class="text-2xl font-bold mb-6">Risk Analysis Assistant</h1>

                    <div class="grid grid-cols-2 gap-6">

                        {/* LEFT: Customer Risk */}
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h2 class="font-bold text-lg mb-4">Customer Risk</h2>
                            <div class="flex gap-2 flex-wrap mb-4">
                                {CUSTOMER_IDS.map(c => (
                                    <button
                                        key={c}
                                        onClick={() => fetchRiskData(c)}
                                        class={`px-3 py-1.5 rounded text-sm border ${selectedCustomer === c ? 'bg-gray-900 text-white border-gray-900' : 'bg-white border-gray-300 hover:border-gray-500'}`}
                                    >
                                        {c}
                                    </button>
                                ))}
                            </div>

                            {!selectedCustomer && <p class="text-gray-400 text-sm">Select a customer above.</p>}
                            {riskLoading && <p class="text-blue-500 animate-pulse text-sm">Analyzing via local model...</p>}
                            {riskError && <p class="text-red-500 text-sm">Error: {riskError}</p>}
                            {riskData && !riskLoading && (
                                <div>
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="font-semibold">{riskData.customer_id}</span>
                                        <span class={`px-2 py-0.5 rounded-full text-xs font-bold ${riskData.risk_score === 'High' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                            {riskData.risk_score} Risk
                                        </span>
                                    </div>
                                    <p class="text-sm text-gray-600 leading-relaxed mb-4">{riskData.explanation}</p>
                                    <div class="text-xs font-semibold text-gray-500 mb-1">Similar past cases</div>
                                    <ul class="list-disc pl-5 text-xs text-gray-500 space-y-1">
                                        {riskData.similar_cases.map(sc => (
                                            <li key={sc.id}>{sc.text} (Ref: {sc.customer_id})</li>
                                        ))}
                                    </ul>
                                </div>
                            )}
                        </div>

                        {/* RIGHT: Document Search */}
                        <div class="bg-white p-6 rounded-lg shadow flex flex-col" style={{maxHeight: '80vh'}}>
                            <h2 class="font-bold text-lg mb-4">Document Search</h2>

                            <form onSubmit={askDoc} class="flex mb-3">
                                <input
                                    type="text"
                                    class="flex-1 border border-gray-300 rounded-l p-2 text-sm outline-none focus:border-blue-500"
                                    placeholder="Ask about the uploaded documents..."
                                    value={docQuery}
                                    onChange={(e) => setDocQuery(e.target.value)}
                                    disabled={docLoading}
                                />
                                <button type="submit" disabled={docLoading || !docQuery.trim()}
                                    class="bg-gray-900 text-white px-4 rounded-r text-sm hover:bg-black disabled:opacity-50">
                                    Ask
                                </button>
                            </form>

                            {docError && <p class="text-red-500 text-sm mb-2">{docError}</p>}
                            {docResult && (
                                <div class="text-xs text-gray-500 mb-2 border-b pb-2">
                                    Last found in <strong>{docResult.doc_name}</strong>, page {docResult.page_number}
                                </div>
                            )}

                            <div class="flex-1 overflow-y-auto space-y-2">
                                {docHistory.map((m, i) => (
                                    <div key={i} class={`text-sm ${m.role === 'user' ? 'font-semibold text-gray-900' : 'text-gray-600 leading-relaxed'}`}>
                                        {m.role === 'user' ? `You: ${m.text}` : m.text}
                                    </div>
                                ))}
                                {docLoading && <p class="text-blue-500 animate-pulse text-sm">Searching...</p>}
                                {docHistory.length === 0 && !docLoading && <p class="text-gray-400 text-sm">Ask a question to search the documents.</p>}
                            </div>

                            {docResult && (
                                <a
                                    href={`http://localhost:8000/files/${docResult.doc_name}#page=${docResult.page_number}`}
                                    target="_blank"
                                    class="text-xs text-blue-600 hover:underline mt-2"
                                >
                                    Open source page in new tab →
                                </a>
                            )}
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
